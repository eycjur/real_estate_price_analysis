[project]
name = "real-estate-price-analysis"
version = "0.1.0"
description = "国交省 不動産取引価格情報にもとづく主要都市の価格回帰分析(静的サイト docs/ のデータ整形と参照実装)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["pytest>=8", "statsmodels>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reap"]
